name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate project secret
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing SUPABASE_PROJECT_ID secret"
            exit 1
          fi

      - name: Deploy ai-gift-assistant
        run: supabase functions deploy ai-gift-assistant --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy process-payment without JWT verification
        run: supabase functions deploy process-payment --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
